[project]
name = "papercuts"
version = "0.1.0"
description = "A complaint box for coding agents — log the friction they hit, review what recurs, fix it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Karanjot Vendal", email = "karanjotgharu60@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "ty>=0.0.1a1",
]

[project.scripts]
papercuts = "papercuts.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "papercuts"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]
